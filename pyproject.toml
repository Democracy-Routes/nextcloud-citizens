[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nextcloud-citizens"
version = "0.6.1"
description = "Nextcloud ExApp for running physical citizens' assemblies"
readme = "README.md"
# Runtime container is Python 3.12; 3.11 floor keeps the host dev venv workable.
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
# Upper bounds keep a rebuild of a released tag reproducible: without them a
# breaking release of e.g. nc_py_api (pre-1.0, moves fast) lands silently.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "nc_py_api>=0.30,<0.32",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "structlog>=24.1,<26",
    "segno>=1.6,<2",
    "websockets>=13,<16",
    "cryptography>=42,<47",
    "fpdf2>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
# namespace variant: citizens/db/migrations has no __init__.py (it is an
# Alembic script directory, not an import package) but must still ship, or a
# wheel install has no migrations to run at startup
include = ["citizens*"]
namespaces = true

[tool.setuptools.package-data]
"citizens.db.migrations" = ["env.py", "*.mako", "versions/*.py"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
