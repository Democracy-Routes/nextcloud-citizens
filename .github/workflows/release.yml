#
# Release in two steps.
#
#   git tag v0.6.0 && git push origin v0.6.0
#       builds the multi-arch image AppAPI pulls and pushes it to GHCR. That is
#       all a tag does: it is enough to install the app on any Nextcloud with
#       `occ app_api:app:register citizens <daemon> --info-xml …`.
#
#   Actions → Release → Run workflow, on the v* tag, "publish" ticked
#       packages the App Store metadata archive, signs it, attaches it to the
#       GitHub release and publishes it to apps.nextcloud.com. Needs the
#       repository secrets below, which a plain tag push must not depend on.
#
# Required repository secrets (App Store step only):
#   APP_PRIVATE_KEY  contents of citizens.key (the CSR key; NEVER committed)
#   APPSTORE_TOKEN   API token from apps.nextcloud.com/account/token
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the Nextcloud App Store'
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/democracy-routes/citizens

jobs:
  image:
    name: Multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Version from info.xml
        id: version
        run: |
          VERSION=$(sed -n 's|.*<version>\(.*\)</version>.*|\1|p' appinfo/info.xml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match info.xml version $VERSION"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 matters: many Nextcloud instances (AIO, home servers) run on ARM
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          # links the GHCR package to this repository (README, visibility)
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max

  appstore:
    name: App Store release
    needs: image
    # Only on demand: the signing key and store token are not required for
    # the image, and a tag push must succeed without them.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Refuse anything but a tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::run this on a v* tag: the download URL and the pre-release flag come from the tag name"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml requests

      - name: Validate info.xml the way the store does
        run: python scripts/validate_info_xml.py

      - name: Package the metadata archive
        id: package
        run: |
          make appstore
          echo "archive=build/citizens.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Sign the archive
        run: |
          printf '%s' "${{ secrets.APP_PRIVATE_KEY }}" > /tmp/citizens.key
          openssl dgst -sha512 -sign /tmp/citizens.key build/citizens.tar.gz \
            | openssl base64 -A > build/signature.txt
          rm -f /tmp/citizens.key

      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/citizens.tar.gz
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}

      - name: Publish to apps.nextcloud.com
        uses: nextcloud-releases/nextcloud-appstore-push-action@v1
        with:
          app_name: citizens
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          download_url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/citizens.tar.gz
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          nightly: false
